license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
iconFile="${mod_id}.png"
displayTest="IGNORE_ALL_VERSION"
description='''
Client-side graphics enhancement mod for Minecraft, built on the Vulkan renderer.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="sodium"
    type="discouraged"
    reason="Sodium replaces the terrain renderer that Helion controls. Helion stays inactive while Sodium is installed."
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="discouraged"
    reason="Iris replaces the render pipeline that Helion controls. Helion stays inactive while Iris is installed."
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
