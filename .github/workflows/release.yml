name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"

      - name: Check tag
        if: github.ref_type == 'tag'
        run: test "${{ github.ref_name }}" = "v${{ steps.version.outputs.version }}"

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Build against the published Arkea
        run: ./gradlew build -Parkea_path=published

      - name: Write release notes
        run: |
          if [ "${{ steps.version.outputs.version }}" = "0.1" ]; then
            echo "Initial release of Helion 0.1 Alpha for Minecraft 26.3 on NeoForge." > build/release-notes.md
          else
            notes=$(awk -v version="${{ steps.version.outputs.version }}" '$0 == "## " version || index($0, "## [" version "]") == 1 {found = 1; next} found && /^## / {exit} found {print}' docs/CHANGELOG.md)
            if [ -z "$notes" ]; then
              notes=$(awk '$0 == "## Unreleased" {found = 1; next} found && /^## / {exit} found {print}' docs/CHANGELOG.md)
            fi
            printf '%s\n' "$notes" > build/release-notes.md
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Helion ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          files: build/libs/*.jar

      - name: Publish to Modrinth and CurseForge
        if: github.ref_type == 'tag' && (env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != '')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'helion' }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID || '1729118' }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/helion-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          name: Helion ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: alpha
          changelog-file: build/release-notes.md
          loaders: neoforge
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: 25
          dependencies: arkea(required)
